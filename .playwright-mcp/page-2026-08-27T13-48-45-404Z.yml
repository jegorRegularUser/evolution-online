    - generic [ref=e71]:
      - paragraph [ref=e72]: Базовая русская «Эволюция» (Правильные игры, 2010). Колода 84 карты, 2–4 игрока. Побеждает тот, чья популяция набрала больше очков после последнего года.
      - heading "Ход года" [level=3] [ref=e73]
      - list [ref=e74]:
        - listitem [ref=e75]:
          - strong [ref=e76]: Развитие.
          - text: "По кругу выкладывайте по одной карте: новое животное или свойство. Свойства кладутся лицом вверх — все видят, кто что выложил. Двойные карты — одно из двух свойств. Паразит только на чужих. Парная карта (симбиоз, сотрудничество, взаимодействие) кладётся между двумя животными — на пару может лежать только одна парная карта. Пас — и больше не играете в этой фазе; когда спасовали все, фаза заканчивается."
        - listitem [ref=e77]:
          - strong [ref=e78]: Кормовая база.
          - text: "2 игрока: 1d6+2. 3: 2d6. 4: 2d6+2."
        - listitem [ref=e79]:
          - strong [ref=e80]: Питание.
          - text: "Ход длится, пока не нажмёте «Закончить ход»: одно действие ход не отдаёт. За ход можно напасть каждым из своих хищников и/или использовать всех пиратов — либо взять одну фишку еды (накормленное животное берёт только в пустой жировой запас); если берёте еду, хищники и пираты в этот ход недоступны. Накормленное животное больше не использует свойства: не нападает, не пиратствует, не топчет, не уходит в спячку и не тратит жир. Топтуны топчут вместе с взятием еды, каждый — раз за ход. Превращение жира — свободное действие. Когда делать нечего совсем, ход передаётся сам. «Пас» выводит вас до конца фазы; фаза заканчивается, когда база пуста, все накормлены, все пасанули или никому нельзя ходить."
        - listitem [ref=e81]:
          - strong [ref=e82]: Вымирание.
          - text: "Ненакормленные погибают. Добор: число выживших + 1. Если никого нет и рука пуста — 6 карт. Пустая колода — последний год."
      - heading "Очки" [level=3] [ref=e83]
      - paragraph [ref=e84]: "2 за каждое выжившее животное, 1 за каждое свойство. Дополнительно: хищник и большой +1, паразит +2. Ничья — по картам в сбросе."
      - heading "Свойства базовой игры" [level=3] [ref=e85]
      - list [ref=e86]:
        - listitem [ref=e87]:
          - generic [ref=e88]:
            - generic [ref=e89]: Хищник
            - generic [ref=e90]: В свой ход вместо фишки еды может напасть на любое животное. При успехе получает 2 синие фишки. Голодный хищник может нападать в каждый свой ход; накормленный не нападает вовсе. +1 к потребности в еде.
        - listitem [ref=e91]:
          - generic [ref=e92]:
            - generic [ref=e93]: Водоплавающее
            - generic [ref=e94]: Может быть съедено только водоплавающим хищником. Водоплавающий хищник ест только водоплавающих.
        - listitem [ref=e95]:
          - generic [ref=e96]:
            - generic [ref=e97]: Камуфляж
            - generic [ref=e98]: Может быть съедено только хищником с острым зрением.
        - listitem [ref=e99]:
          - generic [ref=e100]:
            - generic [ref=e101]: Острое зрение
            - generic [ref=e102]: Хищник с этим свойством может атаковать животных с камуфляжем.
        - listitem [ref=e103]:
          - generic [ref=e104]:
            - generic [ref=e105]: Норное
            - generic [ref=e106]: Накормленное животное нельзя атаковать. Жировой запас не считается кормлением.
        - listitem [ref=e107]:
          - generic [ref=e108]:
            - generic [ref=e109]: Падальщик
            - generic [ref=e110]: Когда любое животное съедено, один падальщик (по часовой от владельца хищника) получает 1 синюю фишку. Не сочетается с хищником.
        - listitem [ref=e111]:
          - generic [ref=e112]:
            - generic [ref=e113]: Симбиоз
            - generic [ref=e114]: "Парное. Карта кладётся между двумя животными (на пару — одна парная карта). Первое животное — симбионт: второе нельзя съесть, пока симбионт жив, и кормить его можно только после симбионта."
        - listitem [ref=e115]:
          - generic [ref=e116]:
            - generic [ref=e117]: Пиратство
            - generic [ref=e118]: "Раз за ход: забрать 1 фишку — красную или синюю — у любого не накормленного полностью животного, своего или чужого. Цвет фишки сохраняется. Ход при этом не заканчивается, но еду из базы в этот ход уже не взять. Накормленный пират не пиратствует."
        - listitem [ref=e119]:
          - generic [ref=e120]:
            - generic [ref=e121]: Отбрасывание хвоста
            - generic [ref=e122]: При атаке можно сбросить эту карту — животное выживает, а хищник получает только 1 синюю фишку вместо двух.
        - listitem [ref=e123]:
          - generic [ref=e124]:
            - generic [ref=e125]: Топотун
            - generic [ref=e126]: В каждую свою фазу питания можно уничтожить 1 фишку из кормовой базы.
        - listitem [ref=e127]:
          - generic [ref=e128]:
